[project]
name = "enquiry-desk"
version = "0.1.0"
description = "Voice and chat enquiry agent for a service business, wired to a CRM, with every call measured"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "tzdata>=2024.2",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "qdrant-client>=1.12",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[project.optional-dependencies]
# Real embeddings. The first run downloads the model files (about 70 MB).
embed = [
    "fastembed>=0.4",
]
# PostgreSQL in place of SQLite, for a deployment with more than one process.
postgres = [
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
]
# Speech in and out, on the CPU. The first run downloads a speech-to-text model (about 150 MB)
# and a voice (about 60 MB).
voice = [
    "numpy>=1.26",
    "faster-whisper>=1.1",
    "piper-tts>=1.2",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enquiry_desk"]
