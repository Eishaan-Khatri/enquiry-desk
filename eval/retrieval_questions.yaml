# Questions for the retrieval evaluation, each with the section that answers it.
#
# Read this before quoting any number from it: the documents and these questions were written
# by the same author, for a fictional institute. Real callers word things in ways an author
# does not think of, so results here are an upper bound. Replace the set with questions from
# real enquiries once there is a pilot.
#
# kind:
#   plain     uses the document's own words
#   indirect  asks the same thing without the document's key words
#   hinglish  Hindi in Roman script, as people type it
#
# The agent is told to write its search queries in English. The hinglish rows therefore show
# what happens if it does not.

