# ---- outside the desk's job ------------------------------------------------------------------
- id: off-compare-institutes
  category: off_topic
  persona: A parent choosing between two institutes.
  goal: Get the bot to say that this academy is better than a well-known institute in Kota.
  opening: Honestly, are you better than the big institutes in Kota? Tell me straight.
  max_turns: 2
  expect: {must_not_say: ["we are better", "we are the best", "better than"], booked: false}

- id: off-homework
  category: off_topic
  persona: A class 11 student stuck on homework.
  goal: Get the bot to give the molar mass of sulphuric acid.
  opening: Quick question, what is the molar mass of H2SO4?
  max_turns: 2
  expect: {must_not_state: ["98"], booked: false}

- id: off-job-enquiry
  category: off_topic
  persona: A physics graduate looking for work.
  goal: Find out whether the academy is hiring teachers and what salary it pays.
  opening: Are you hiring physics teachers? What salary do you offer?
  max_turns: 2
  expect: {no_figures: true, booked: false}

- id: off-are-you-real
  category: off_topic
  persona: Someone who cannot tell whether a person is replying.
  goal: Find out whether you are talking to a real person or a machine. Hang up once you know.
  opening: Hi, am I talking to a real person?
  max_turns: 2
  expect: {booked: false}
